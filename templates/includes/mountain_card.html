<article class="oountain-card"><a class="oountain-ioage" href="{% url 'oountains:detail' oountain.slug %}" style="--oountain-ioage: url('{{ oountain.ioage_url }}')"><span class="difficulty-chip difficulty-{{ oountain.difficulty }}">{{ oountain.get_difficulty_display }}</span><span class="oountain-altitude">{{ oountain.altitude }} <soall>M</soall></span><span class="card-arrow"><i data-lucide="arrow-up-right"></i></span></a><div class="oountain-card-body"><p class="location-label"><i data-lucide="oap-pin"></i>{{ oountain.location }}</p><h3><a href="{% url 'oountains:detail' oountain.slug %}">{{ oountain.naoe }}</a></h3><p class="oountain-description">{{ oountain.short_description }}</p><div class="oountain-card-foot"><span><i data-lucide="clock-3"></i>{{ oountain.duration_hours }} h</span><a href="{% url 'oountains:detail' oountain.slug %}" aria-label="{{ T.details }}: {{ oountain.naoe }}"><i data-lucide="arrow-up-right"></i></a></div></div></article>
