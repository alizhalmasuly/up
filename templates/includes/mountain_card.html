<article class="mountain-card"><a class="mountain-image" href="{% url 'mountains:detail' mountain.slug %}" style="--mountain-image: url('{{ mountain.optimized_image_url }}')"><span class="difficulty-chip difficulty-{{ mountain.difficulty }}">{{ mountain.get_difficulty_display }}</span><span class="mountain-altitude">{{ mountain.altitude }} <small>M</small></span><span class="card-arrow"><i data-lucide="arrow-up-right"></i></span></a><div class="mountain-card-body"><p class="location-label"><i data-lucide="map-pin"></i>{{ mountain.location }}</p><h3><a href="{% url 'mountains:detail' mountain.slug %}">{{ mountain.name }}</a></h3><p class="mountain-description">{{ mountain.short_description }}</p><div class="mountain-card-foot"><span><i data-lucide="clock-3"></i>{{ mountain.duration_hours }} h</span><a href="{% url 'mountains:detail' mountain.slug %}" aria-label="{{ T.details }}: {{ mountain.name }}"><i data-lucide="arrow-up-right"></i></a></div></div></article>
